version: '3.8'

services:
  # Pod 1: Data Gather
  data-gather:
    build: ./pods/data-gather
    container_name: fraud-detection-gather
    volumes:
      - ${FB_MOUNT:-/mnt/fsaai-shared/ebiser}:/mnt/fsaai-shared/ebiser
      - fa-storage:/root/ebiser/nvidia.financial.fraud.detection
    environment:
      - FB_MOUNT=/mnt/fsaai-shared/ebiser
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - NUM_TRANSACTIONS=${NUM_TRANSACTIONS:-1000000}
    networks:
      - fraud-detection

  # Pod 2: Data Prep (GPU Required)
  data-prep:
    build: ./pods/data-prep
    container_name: fraud-detection-prep
    volumes:
      - ${FB_MOUNT:-/mnt/fsaai-shared/ebiser}:/mnt/fsaai-shared/ebiser
      - fa-storage:/root/ebiser/nvidia.financial.fraud.detection
    environment:
      - FB_MOUNT=/mnt/fsaai-shared/ebiser
      - INPUT_FILE=${INPUT_FILE}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    depends_on:
      - data-gather
    networks:
      - fraud-detection

  # Pod 3: Model Build (GPU Required)
  model-build:
    build: ./pods/model-build
    container_name: fraud-detection-build
    volumes:
      - ${FB_MOUNT:-/mnt/fsaai-shared/ebiser}:/mnt/fsaai-shared/ebiser
      - fa-storage:/root/ebiser/nvidia.financial.fraud.detection
    environment:
      - FB_MOUNT=/mnt/fsaai-shared/ebiser
      - FA_MOUNT=/root/ebiser/nvidia.financial.fraud.detection
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - FEATURES_FILE=${FEATURES_FILE}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    depends_on:
      - data-prep
    networks:
      - fraud-detection

  # Pod 4: Inference (GPU Required)
  inference:
    build: ./pods/inference
    container_name: fraud-detection-inference
    ports:
      - "8000:8000"  # HTTP
      - "8001:8001"  # gRPC
      - "8002:8002"  # Metrics
    volumes:
      - fa-storage:/root/ebiser/nvidia.financial.fraud.detection
    environment:
      - FA_MOUNT=/root/ebiser/nvidia.financial.fraud.detection
      - MODEL_REPOSITORY=/root/ebiser/nvidia.financial.fraud.detection/model_repository
      - NOTIFICATION_ENDPOINT=http://notification:5000/notify/fraud
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    depends_on:
      - model-build
      - notification
    networks:
      - fraud-detection
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Pod 5: Notification
  notification:
    build: ./pods/notification
    container_name: fraud-detection-notification
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - DEBUG=False
    networks:
      - fraud-detection
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  fraud-detection:
    driver: bridge

volumes:
  fa-storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${FA_MOUNT:-~/ebiser/nvidia.financial.fraud.detection}

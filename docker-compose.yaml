# Financial Fraud Detection Pipeline
# Demonstrates Pure Storage FlashBlade/FlashArray with NVIDIA GPU acceleration
#
# Usage:
#   make pipeline    # Run full pipeline (pods 1-4)
#   make clean-data  # Remove generated data
#   make clean-all   # Full cleanup

services:
  # ============================================================================
  # Pod 1: Data Generator
  # Generates synthetic credit card transactions at high throughput (2+ GB/s)
  # ============================================================================
  data-gather:
    build: ./pods/data-gather
    container_name: fraud-data-gather
    volumes:
      - ${FB_DATA:-/mnt/fsaai-shared/ebiser/fraud-data}:/data/output
    environment:
      - OUTPUT_DIR=/data/output
      - NUM_WORKERS=${NUM_WORKERS:-128}
      - DURATION_SECONDS=${DURATION_SECONDS:-60}
      - CHUNK_SIZE=${CHUNK_SIZE:-1000000}
      - FRAUD_RATE=${FRAUD_RATE:-0.005}
    deploy:
      resources:
        limits:
          cpus: '32'
          memory: 64G
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - fraud-net

  # ============================================================================
  # Pod 2: Feature Engineering (Multi-GPU)
  # RAPIDS cuDF/Dask for GPU-accelerated data preparation
  # ============================================================================
  data-prep:
    build: ./pods/data-prep
    container_name: fraud-data-prep
    volumes:
      - ${FB_DATA:-/mnt/fsaai-shared/ebiser/fraud-data}:/data/input:ro
      - ${FB_PREP:-/mnt/fsaai-shared/ebiser/prep-output}:/data/output
    environment:
      - INPUT_DIR=/data/input
      - OUTPUT_DIR=/data/output
      - BATCH_MODE=true
      - LATEST_ONLY=true
      - MAX_FILES_PER_RUN=${MAX_FILES:-100}
      - USE_MULTI_GPU=true
    shm_size: '16gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - fraud-net

  # ============================================================================
  # Pod 3: Model Training (GPU)
  # XGBoost with GPU acceleration for fraud classification
  # ============================================================================
  model-build:
    build: ./pods/model-build
    container_name: fraud-model-build
    volumes:
      - ${FB_PREP:-/mnt/fsaai-shared/ebiser/prep-output}:/data/input:ro
      - ${MODEL_REPO:-./model_repository}:/data/models
    environment:
      - PREP_OUTPUT_DIR=/data/input
      - FA_MOUNT=/data/models
      - FEATURES_FILE=${FEATURES_FILE:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - fraud-net

  # ============================================================================
  # Pod 4: Inference Server (GPU)
  # NVIDIA Triton with FIL backend for real-time fraud detection
  # ============================================================================
  inference:
    image: nvcr.io/nvidia/tritonserver:24.02-py3
    container_name: frosty-hypatia
    ports:
      - "8000:8000"   # HTTP
      - "8001:8001"   # gRPC
      - "8002:8002"   # Metrics
    volumes:
      - ${MODEL_REPO:-./model_repository}:/models:ro
    command: ["tritonserver", "--model-repository=/models"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - fraud-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Pod 5: Notification Service
  # REST API for fraud alerts
  # ============================================================================
  notification:
    build: ./pods/notification
    container_name: fraud-notification
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
    networks:
      - fraud-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  fraud-net:
    driver: bridge
# Fraud Detection Demo
# Demonstrates Pure Storage FlashBlade/FlashArray with NVIDIA GPU acceleration
#
# All paths are configured in .env file (single source of truth)
#
# Usage:
#   make pipeline    # Run full pipeline (pods 1-4)
#   make benchmark   # Run CPU vs GPU inference benchmark
#   make clean-data  # Remove generated data
#   make clean-all   # Full cleanup

services:
  # ============================================================================
  # Pod 1: Data Generator
  # Generates synthetic credit card transactions at high throughput (2+ GB/s)
  # Input:  None
  # Output: ${FB_DATA}/run_YYYYMMDD_HHMMSS/*.parquet
  # ============================================================================
  data-gather:
    build: ./pods/data-gather
    container_name: fraud-data-gather
    volumes:
      # Mount FlashBlade for high-throughput writes
      - ${FB_DATA}:/data/output
    environment:
      - OUTPUT_DIR=/data/output
      - NUM_WORKERS=${NUM_WORKERS:-128}
      - DURATION_SECONDS=${DURATION_SECONDS:-60}
      - CHUNK_SIZE=${CHUNK_SIZE:-1000000}
      - FRAUD_RATE=${FRAUD_RATE:-0.005}
    deploy:
      resources:
        limits:
          cpus: '32'
          memory: 64G
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - fraud-net

  # ============================================================================
  # Pod 2: Feature Engineering (Multi-GPU)
  # RAPIDS cuDF/Dask for GPU-accelerated data preparation
  # Runs CPU first, then GPU, to demonstrate acceleration
  # Input:  ${FB_DATA}/run_*/worker_*.parquet (from Pod 1)
  # Output: ${FB_PREP}/features_run_*.parquet
  # ============================================================================
  data-prep:
    build: ./pods/data-prep
    container_name: fraud-data-prep
    volumes:
      # Read from Pod 1 output
      - ${FB_DATA}:/data/input:ro
      # Write features to prep output
      - ${FB_PREP}:/data/output
    environment:
      - INPUT_DIR=/data/input
      - OUTPUT_DIR=/data/output
      - BATCH_MODE=true
      - LATEST_ONLY=${LATEST_ONLY:-true}
      - MAX_FILES_PER_RUN=${MAX_FILES_PER_RUN:-100}
      - USE_MULTI_GPU=${USE_MULTI_GPU:-true}
    shm_size: '16gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - fraud-net

  # ============================================================================
  # Pod 3: Model Training (GPU)
  # XGBoost with GPU acceleration for fraud classification
  # Input:  ${FB_PREP}/features_*.parquet (from Pod 2)
  # Output: ${FA_MODEL_REPO}/fraud_xgboost/ (Triton model repository)
  # ============================================================================
  model-build:
    build: ./pods/model-build
    container_name: fraud-model-build
    volumes:
      # Read prepared features from Pod 2
      - ${FB_PREP}:/data/input:ro
      # Write model directly to Triton model repository
      - ${FA_MODEL_REPO}:/data/models
    environment:
      - PREP_OUTPUT_DIR=/data/input
      - FA_MOUNT=/data/models
      - FEATURES_FILE=${FEATURES_FILE:-}
    user: root
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - fraud-net

  # ============================================================================
  # Pod 4: Inference Server (GPU)
  # NVIDIA Triton with FIL backend for real-time fraud detection
  # Input:  ${FA_MODEL_REPO}/fraud_xgboost/ (from Pod 3)
  # ============================================================================
  inference:
    image: nvcr.io/nvidia/tritonserver:24.02-py3
    container_name: fraud-inference
    ports:
      - "8000:8000"   # HTTP
      - "8001:8001"   # gRPC
      - "8002:8002"   # Metrics
    volumes:
      # Mount model repository - must match Pod 3 output location
      - ${FA_MODEL_REPO}:/models:ro
    command: ["tritonserver", "--model-repository=/models", "--strict-model-config=false", "--log-verbose=1"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - fraud-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Pod 5: Notification Service
  # REST API for fraud alerts
  # ============================================================================
  notification:
    build: ./pods/notification
    container_name: fraud-notification
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
    networks:
      - fraud-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # Pod 6: Storage & Inference Stress Test
  # Demonstrates Pure Storage FlashArray + NVIDIA Triton performance
  # - FlashArray test: Model loading I/O (defeats page cache)
  # - Triton test: Sustained inference throughput via gRPC
  # Input:  ${FA_MODEL_REPO}/fraud_xgboost*/ (model from Pod 3)
  #         ${FB_DATA}/run_*/*.parquet (test data from Pod 1)
  # Output: Console performance metrics + Grafana dashboards
  # ============================================================================
  benchmark:
    build: ./pods/benchmark
    container_name: fraud-benchmark
    volumes:
      # Model repository on FlashArray (stress test target)
      # NOTE: Must be read-write for creating model copies
      - ${FA_MODEL_REPO}:/data/models
      # Data from FlashBlade (for test inference)
      - ${FB_DATA}:/data/input:ro
    environment:
      # Common settings
      - MODEL_DIR=/data/models
      - DATA_DIR=/data/input
      - DURATION_SECONDS=${BENCHMARK_DURATION:-60}
      # FlashArray test settings
      - RUN_FLASHARRAY=${RUN_FLASHARRAY:-true}
      - NUM_WORKERS=${BENCHMARK_WORKERS:-8}
      - NUM_MODEL_COPIES=${BENCHMARK_COPIES:-100}
      - RUN_INFERENCE=false
      # Triton test settings
      - RUN_TRITON=${RUN_TRITON:-false}
      - TRITON_GRPC_URL=inference:8001
      - TRITON_WORKERS=${TRITON_WORKERS:-8}
      - TRITON_BATCH_SIZE=${TRITON_BATCH_SIZE:-1000}
    networks:
      - fraud-net

networks:
  fraud-net:
    driver: bridge

version: '3.8'

services:
  # Pod 1: Data Gather - High-Performance FlashBlade Stress Test
  data-gather:
    build: ./pods/data-gather
    container_name: fraud-detection-gather
    volumes:
      # Input: Kaggle creditcard.csv template (read-only)
      - ${TEMPLATE_MOUNT:-/mnt/datasets/kaggle/creditcardfraud}:/mnt/datasets/kaggle/creditcardfraud:ro
      # Output: FlashBlade high-throughput storage (read/write)
      - ${FB_OUTPUT_MOUNT:-/mnt/fsaai-shared/ebiser/fraud-data}:/mnt/fsaai-shared/ebiser/fraud-data
    environment:
      # Template configuration
      - TEMPLATE_DIR=/mnt/datasets/kaggle/creditcardfraud
      - TEMPLATE_FILE=creditcard.csv
      # Output configuration
      - OUTPUT_DIR=/mnt/fsaai-shared/ebiser/fraud-data
      # Performance tuning
      - NUM_WORKERS=${NUM_WORKERS:-128}
      - DURATION_SECONDS=${DURATION_SECONDS:-300}
      - CHUNK_SIZE=${CHUNK_SIZE:-10000}
    # Resource allocation for high-thread workloads
    deploy:
      resources:
        limits:
          cpus: '32'
          memory: 64G
        reservations:
          cpus: '16'
          memory: 32G
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - fraud-detection


  # Pod 2: Data Prep - GPU-Accelerated ETL with RAPIDS for Spark
  data-prep:
    build:
      context: ./pods/data-prep
      dockerfile: Dockerfile
    container_name: fraud-detection-prep
    volumes:
      # Input: Generated data from Pod 1
      - ${FB_OUTPUT_MOUNT:-/mnt/fsaai-shared/ebiser/fraud-data}:/mnt/fsaai-shared/ebiser/fraud-data:ro
      # Output: Prepared features for Pod 3
      - ${FB_MOUNT:-/mnt/fsaai-shared/ebiser}:/mnt/fsaai-shared/ebiser
      # Spark work directory (for shuffle/spill)
      - /tmp/spark-work:/tmp/spark-work
    environment:
      # Directory paths
      - INPUT_DIR=/mnt/fsaai-shared/ebiser/fraud-data
      - OUTPUT_DIR=/mnt/fsaai-shared/ebiser/prep_output
      # Processing mode
      - BATCH_MODE=${BATCH_MODE:-false}
      - POLL_INTERVAL=${POLL_INTERVAL:-5}
      - SPECIFIC_RUN=${SPECIFIC_RUN:-}
      # GPU configuration
      - NUM_GPUS=${NUM_GPUS:-2}
      - GPU_MEMORY_FRACTION=0.8
      - ENABLE_GDS=${ENABLE_GDS:-true}
      # Output optimization
      - COALESCE_OUTPUT=8
      # Spark master (local for single-node, or cluster URL)
      - SPARK_MASTER=${SPARK_MASTER:-local[*]}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
        limits:
          cpus: '32'
          memory: 64G
    depends_on:
      data-gather:
        condition: service_completed_successfully
    networks:
      - fraud-detection
    healthcheck:
      test: ["CMD", "python", "-c", "import pyspark; print('ok')"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    # Restart policy for continuous processing mode
    restart: unless-stopped

  # Pod 3: Model Build (GPU Required)
  model-build:
    build: ./pods/model-build
    container_name: fraud-detection-build
    volumes:
      - ${FB_MOUNT:-/mnt/fsaai-shared/ebiser}:/mnt/fsaai-shared/ebiser
      - fa-storage:/root/ebiser/nvidia.financial.fraud.detection
    environment:
      - FB_MOUNT=/mnt/fsaai-shared/ebiser
      - FA_MOUNT=/root/ebiser/nvidia.financial.fraud.detection
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - FEATURES_FILE=${FEATURES_FILE}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    depends_on:
      - data-prep
    networks:
      - fraud-detection

  # Pod 4: Inference (GPU Required)
  inference:
    build: ./pods/inference
    container_name: fraud-detection-inference
    ports:
      - "8000:8000"  # HTTP
      - "8001:8001"  # gRPC
      - "8002:8002"  # Metrics
    volumes:
      - fa-storage:/root/ebiser/nvidia.financial.fraud.detection
    environment:
      - FA_MOUNT=/root/ebiser/nvidia.financial.fraud.detection
      - MODEL_REPOSITORY=/root/ebiser/nvidia.financial.fraud.detection/model_repository
      - NOTIFICATION_ENDPOINT=http://notification:5000/notify/fraud
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    depends_on:
      - model-build
      - notification
    networks:
      - fraud-detection
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Pod 5: Notification
  notification:
    build: ./pods/notification
    container_name: fraud-detection-notification
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - DEBUG=False
    networks:
      - fraud-detection
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  fraud-detection:
    driver: bridge

volumes:
  fa-storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${FA_MOUNT:-~/ebiser/nvidia.financial.fraud.detection}

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fraud-demo

resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - worker-cpu-deployment.yaml
  - worker-gpu-deployment.yaml
  - dashboard-deployment.yaml

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/name: fraud-detection-demo
  app.kubernetes.io/part-of: fraud-detection

